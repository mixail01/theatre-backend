services:
  theatre-api:
    container_name: theatre-api
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    env_file:
      - ./.env
    ports:
      - 8000:8000
    restart: unless-stopped

  postgres-db:
    container_name: postgres-db
    image: postgres:15.1-bullseye
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata
    environment:
      - TZ=Europe/Kiev
    env_file:
      - ./.env
    ports:
      - 5433:5432
    restart: unless-stopped
